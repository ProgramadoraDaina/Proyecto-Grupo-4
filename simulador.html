<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MiniFinance - Simulador</title>
    <link rel="stylesheet" href="resources/style.css">
    <link rel="stylesheet" href="resources/simulador.css">
</head>

<body>

    <div class="layout">

        <!-- 🔹 SIDEBAR -->
        <aside class="sidebar">
            <h1>MiniFinance</h1>
            <!-- Navegación -->
            <nav>
                <ul>
                    <li><a href="inicio.html">Inicio</a></li>
                    <li><a href="simulador.html">Simulador</a></li>
                </ul>
            </nav>
            <hr>
            <!-- Meta -->
            <section>

                <h2>Meta</h2>
                <input type="number" id="metaInput" placeholder="Meta">
                <button onclick="guardarMeta()">Guardar</button>

                <p id="metaTexto">$0</p>
            </section>

        </aside>

        <main>
            <header>
                <h2>Simulador de Ahorro</h2>
            </header>
            <div class="stats">

  <div class="card display-card ingresos">
    <div class="icono-ingresos"></div>
    <div>
    <p>Ingresos mensuales</p>
    <h3 id="ingresosCard">$0</h3>
    </div>
  </div>

  <div class="card display-card gastos">
    <div class="icono-gastos"></div>
    <div>
    <p>Gastos mensuales</p>
    <h3 id="gastosCard">$0</h3>
    </div>
  </div>

<div class="card display-card ahorro">
  <div class="icono-ahorro"></div>
  <div>
    <p>Ahorro mensual</p>
    <h3 id="ahorroCard">$0</h3>
    </div>
  </div>

  
<div class="card display-card tasa">
  <div class="icono-tasa"></div>
  <div>
    <p>Tasa de ahorro</p>
    <h3 id="tasaCard">0%</h3>
    </div>
</div>


</div>

            <!-- Acciones del simulador -->
            <section>
                <h2>Control</h2>

                <button onclick="calcularTiempoMeta()">
                    Calcular estimación
                </button>
                <button onclick="borrarTodo()">🗑️ Resetear datos</button>

                <p id="resultadoSim"></p>
            </section>

            <figure>
                <canvas id="grafico" width="400" height="200"></canvas>
                <figcaption>Evolución del ahorro en el tiempo</figcaption>
            </figure>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="js/main.js"></script>

</body>

</html>
