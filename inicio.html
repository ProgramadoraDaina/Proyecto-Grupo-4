<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MiniFinance - Inicio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

    <!-- 🔹 SIDEBAR -->
    <aside class="sidebar">
        <h1>MiniFinance</h1>
            <!-- Navegación -->
            <nav>
                <ul>
                    <li><a href="inicio.html">Inicio</a></li>
                    <li><a href="simulador.html">Simulador</a></li>
                </ul>
            </nav>
        <hr>
    <section>
        <h3>Meta</h3>
        <input type="number" id="metaInput" placeholder="Meta">
        <button onclick="guardarMeta()">Guardar</button>

        <p id="metaTexto">$0</p>
    </section>
    </aside>

    <!-- 🔹 MAIN -->
    <main> 
    <!-- Encabezado -->
        <header>
            <h2>Datos Financieros</h2>
        </header>
    <!-- Datos financieros -->
        <section>
            <p>Ingresos: $<span id="ingresos">0</span></p>
            <p>Gastos: $<span id="gastos">0</span></p>
            <p>Saldo: $<span id="saldo">0</span></p>

        <div id="alertas"></div>
        </section>
     <hr>

<div class="contenedor-movimientos">

    <!-- 🔹 IZQUIERDA: FORMULARIO -->
    <section class="panel">
        <h2>Agregar movimiento</h2>

        <form onsubmit="agregarMovimiento(); return false;">
            <label>Tipo:</label>
            <select id="tipo">
                <option value="ingreso">Ingreso</option>
                <option value="gasto">Gasto</option>
            </select>

            <label>Monto:</label>
            <input type="number" id="monto" placeholder="Monto">

            <label>Categoría:</label>
            <select id="categoria">
                <option>Sueldo</option>
                <option>Comida</option>
                <option>Transporte</option>
                <option>Regalos</option>
                <option>Ocio</option>
            </select>

            <label>Frecuencia:</label>
            <select id="frecuencia">
                <option value="unico">Una vez</option>
                <option value="mensual">Mensual</option>
                <option value="semanal">Semanal</option>
            </select>

            <button type="submit">Agregar</button>
        </form>
    </section>

    <!-- 🔹 DERECHA: MOVIMIENTOS -->
    <section class="panel">
        <h2>Movimientos recientes</h2>
        <div id="listaMovimientos"></div>
    </section>

</div>
    </main>
</div>
<script src="main.js"></script>
</body>
</html>
